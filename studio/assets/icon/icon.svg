<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>giz Estúdio</title>
  <defs>
    <filter id="chalk" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#chalk)" stroke-linecap="round" stroke-linejoin="round">
    <!-- speech bubble: a round body with its tail at the bottom left -->
    <path d="M64 9 C93 8.5 117 28 117.5 57 C118 86 95 105 65 105.5 C56 105.6 48 104 41 101 L19 115 C17 116.2 15 114.5 15.8 112.4 L23.5 91 C15 82 10.5 70.5 10.5 57.5 C10 29 34 9.5 64 9 Z" fill="#f2c14e" stroke="#f3efe2" stroke-width="6.5"/>
    <!-- eyes -->
    <ellipse cx="46" cy="51" rx="7" ry="9" fill="#26302d"/>
    <ellipse cx="82" cy="51" rx="7" ry="9" fill="#26302d"/>
    <circle cx="48.5" cy="47.5" r="2.4" fill="#f3efe2"/>
    <circle cx="84.5" cy="47.5" r="2.4" fill="#f3efe2"/>
    <!-- cheeks -->
    <ellipse cx="34" cy="68" rx="6.5" ry="4.5" fill="#e8735a" opacity="0.85"/>
    <ellipse cx="94" cy="68" rx="6.5" ry="4.5" fill="#e8735a" opacity="0.85"/>
    <!-- smile -->
    <path d="M50 70 C56 81 72 81.5 78 70" fill="none" stroke="#26302d" stroke-width="6.5"/>
  </g>
</svg>
