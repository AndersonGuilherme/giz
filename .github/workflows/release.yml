# Builds the giz Estúdio installers on each OS (the packages are not signed: see the README, "Instalar") and puts them
# in a draft GitHub release. Runs on a v* tag or by hand (then it only keeps the files as workflow artifacts).
# Verify runs once, on Linux, before any installer is made; the Linux make also runs the packaged smoke with no network.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # The CUDA provider is downloaded by the app's GPU setup, never packaged.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Verify core
        working-directory: core
        run: npm ci && npm run verify

      - name: Verify studio
        working-directory: studio
        run: npm ci && npm run verify

  make:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Ubuntu: the Linux packages then run on older glibc too. macOS 14 is Apple Silicon.
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache: what goes into a release is installed fresh from the lockfiles.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Linux packaging tools (rpm, AppImage)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm squashfs-tools fakeroot

      - name: Install core
        working-directory: core
        run: npm ci

      - name: Install studio
        working-directory: studio
        run: npm ci

      - name: Make the installers
        working-directory: studio
        run: npm run make

      # The whole smoke walk on the packaged app, in a network namespace with loopback only (renders need no network).
      - name: Packaged smoke, offline
        if: runner.os == 'Linux'
        working-directory: studio
        env:
          SMOKE_OFFLINE: '1'
          SMOKE_HEADLESS: '1'
        run: node smoke/packaged.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: giz-estudio-${{ runner.os }}
          path: |
            studio/out/make/**/*.deb
            studio/out/make/**/*.rpm
            studio/out/make/**/*.AppImage
            studio/out/make/**/*.zip
            studio/out/make/**/*.dmg
            studio/out/make/**/*.exe
            studio/out/make/**/*.nupkg
            studio/out/make/**/RELEASES
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: make
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: installers
          merge-multiple: true

      # Version-less copies of each installer, next to the versioned ones: the site links to
      # releases/latest/download/<stable name>, which keeps working on every release (once the draft is published).
      - name: Stable file names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stable
          # copy <required|optional> <find -iname pattern> <stable name>
          copy() {
            mapfile -t found < <(find installers -type f -iname "$2")
            if [ "${#found[@]}" -eq 1 ]; then
              cp "${found[0]}" "stable/$3"
              echo "$3 <- ${found[0]}"
            elif [ "${#found[@]}" -eq 0 ] && [ "$1" = optional ]; then
              echo "no $2: $3 skipped"
            else
              echo "::error::expected one file for $2, found ${#found[@]}: ${found[*]:-none}"
              exit 1
            fi
          }
          copy required '*setup.exe' gizzycera-windows-x64-setup.exe
          copy required '*-arm64.dmg' gizzycera-macos-arm64.dmg
          copy required '*_amd64.deb' gizzycera-linux-amd64.deb
          copy required '*-x64.AppImage' gizzycera-linux-x64.AppImage
          copy required '*-linux-x64-*.zip' gizzycera-linux-x64.zip
          copy optional '*-darwin-arm64-*.zip' gizzycera-macos-arm64.zip
          copy optional '*-win32-x64-*.zip' gizzycera-windows-x64.zip

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          files: |
            installers/**/*
            stable/*
