# The landing page as static files (Dockerfile in this folder). Security headers are set once at the server level:
# the locations below use `expires` (not add_header) for caching, so they inherit them.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    # text/html is always compressed; images, fonts and video are already compressed formats.
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # The same policy as the page's <meta> CSP, plus frame-ancestors (only a header can say it).
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; font-src 'self'; connect-src https://api.github.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Images, fonts and video: cached long. Their names carry no version, so not "immutable": 30 days, then revalidated.
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # The example videos (several MB each): cached 30 days like the rest, served in byte ranges so the browser can
    # read just the metadata, seek, and fetch the second language only when the visitor switches.
    location /assets/video/ {
        expires 30d;
        sendfile on;
        tcp_nopush on;
        max_ranges 16;
        try_files $uri =404;
    }

    # The page itself is always revalidated, so a new release shows at once.
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
